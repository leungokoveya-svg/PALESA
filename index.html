<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Palesa, will you be my girlfriend and Valentine?❤️" />
  <meta name="robots" content="index, follow" />

  <meta property="og:title" content="Palesa, be my girlfriend and Valentine?❤️" />
  <meta property="og:description" content="Palesa, will you be my girlfriend and Valentine?🥹❤️" />
  <meta property="og:image" content="assets/og-image.png" />
  <meta property="og:url" content="https://your-site-url.com" />
  <meta property="og:type" content="website" />

  <title>Palesa — My Girlfriend & Valentine ❤️</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      /* Baby blue + pink gradient */
      background: linear-gradient(135deg, #bde6ff, #ffc1d9);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      bottom: -50px;
      font-size: 24px;
      animation: floatUp 6s linear infinite;
      opacity: 0.7;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 0.7; }
      100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
    }

    .card {
      background: rgba(255,255,255,0.95);
      padding: 2rem;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
      max-width: 460px;
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 2;
    }

    h1 {
      color: #ff6fa5; /* soft pink */
      margin-bottom: 0.5rem;
      font-size: 2rem;
    }

    p {
      color: #444;
    }

    .special-message {
      font-style: italic;
      color: #ff6fa5;
      margin: 1rem 0;
    }

    .buttons {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      position: relative;
    }

    button {
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 999px;
      font-size: 1rem;
      cursor: pointer;
    }

    .yes {
      background: #ff6fa5;
      color: white;
    }

    .no {
      background: #e9f6ff; /* baby blue tint */
      color: #444;
      position: absolute;
    }

    .hint {
      font-size: 0.8rem;
      color: #777;
      margin-top: 0.8rem;
    }
  </style>
</head>
<body>
  <!-- Background music: POV by Ariana Grande -->
  <!-- IMPORTANT: Add your audio file to assets/pov.mp3 in your repo -->
  <audio id="bg-music" loop autoplay>
    <source src="PALESA/assets/Ariana_Grande_-_pov_(Lyrics)_128k.mp3" type="audio/mpeg">
  </audio>

  <!-- Floating hearts container -->
  <div id="hearts"></div>

  <div class="card">
    <h1>Palesa ❤️</h1>
    <p><strong>Will you be my girlfriend and my Valentine?</strong></p>

    <div class="special-message">
      "Palesa, you make my days brighter, my heart softer, and my smile wider. I’d love to call you mine." 💕
    </div>

    <div class="buttons">
      <button class="yes" onclick="alert('YAY! You made me the happiest person 🥹❤️')">Yes</button>
      <button class="no" id="noBtn">No</button>
    </div>

    <div class="hint">(Tap anywhere to enable music)</div>
  </div>

  <script>
    // Floating hearts effect
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
      document.getElementById('hearts').appendChild(heart);

      setTimeout(() => heart.remove(), 6000);
    }
    setInterval(createHeart, 600);

    // Runaway "No" button
    const noBtn = document.getElementById('noBtn');
    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * (window.innerWidth - 150);
      const y = Math.random() * (window.innerHeight - 80);
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    });

    // Enable music on first interaction (browser policy)
    window.addEventListener('click', () => {
      document.getElementById('bg-music').play();
    }, { once: true });
  </script>
</body>
</html>
